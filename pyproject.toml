[project]
name = "fuelfinder-cv"
version = "0.1.0"
description = "Precios de carburantes en la Comunitat Valenciana: marca frente a low-cost"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
