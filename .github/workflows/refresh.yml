name: Actualizar precios del mapa

# Refresca SOLO los precios actuales del mapa (--map-only). El analisis semanal
# y las imagenes son las del post publicado y no cambian solos.
on:
  schedule:
    - cron: "17 */3 * * *"   # cada 3 horas, fuera de la hora en punto
  workflow_dispatch:          # y a mano desde la pestana Actions

permissions:
  contents: write

concurrency:
  group: refresh-map
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Descargar precios actuales
        run: python -m fuelfinder.build --map-only
      - name: Guardar si han cambiado
        run: |
          if git diff --quiet -- docs/data; then
            echo "Sin cambios en los precios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "datos: precios del mapa $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
